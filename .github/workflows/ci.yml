name: CI

# Switched off on GitHub for the private repo, and never started by a push: its runs kept using
# up the month's Windows minutes. Every check runs on the development machine instead, before
# each release (docs/releasing.md). Kept so it can be started by hand if that ever changes.
on:
  workflow_dispatch:

jobs:
  # Types, pure logic, and the real media pipeline. The e2e suite generates its
  # own footage with the bundled ffmpeg, so nothing here needs checked-in media
  # or anything set up on the runner.
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:e2e

# The app tests (npm run test:ui) are not run here. On GitHub's runner, with no graphics card,
# 26 of their 67 files failed while all of them pass on the development machine, so they are a
# release gate run on that machine instead (docs/releasing.md).

