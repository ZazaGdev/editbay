appId: com.editbay.editor
productName: Editbay
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # The command line for agents (plan 74) is built into out/cli for the repository's own use, not the app.
  - '!out/cli/**'
  # The app runs with nothing from node_modules: everything it imports is bundled,
  # and ffmpeg and ffprobe come in as resources below.
  - '!node_modules/**'

# The captions' font, which ffmpeg burns them in with, as a file of its own,
# and every licence notice, the font's included. The window has its own copy
# of the font, bundled with its assets.
extraResources:
  # ffmpeg and ffprobe, one gyan.dev build fetched by npm install (plan 89). As
  # resources they are real files on disk, which they must be to be run.
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  # Follow face (plan 100): ONNX Runtime, a native module, so it lives beside
  # the app rather than in its bundle, CPU only (no DirectML, about 38 MB less),
  # and the face model it runs.
  - from: node_modules/onnxruntime-node
    to: onnxruntime/node_modules/onnxruntime-node
    filter:
      - package.json
      - dist/**/*.js
      - bin/napi-v6/win32/x64/onnxruntime.dll
      - bin/napi-v6/win32/x64/onnxruntime_binding.node
  - from: node_modules/onnxruntime-common
    to: onnxruntime/node_modules/onnxruntime-common
    filter:
      - package.json
      - dist/cjs/**/*
  # The Visual C++ runtime ONNX Runtime is built against, which Electron does
  # not carry and a PC without the redistributable lacks. Microsoft lets these
  # files ship next to the program that uses them.
  # One by one: a folder there cannot be scanned.
  - from: C:/Windows/System32/msvcp140.dll
    to: onnxruntime/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/msvcp140.dll
  - from: C:/Windows/System32/msvcp140_1.dll
    to: onnxruntime/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/msvcp140_1.dll
  - from: C:/Windows/System32/msvcp140_atomic_wait.dll
    to: onnxruntime/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/msvcp140_atomic_wait.dll
  - from: C:/Windows/System32/vcruntime140.dll
    to: onnxruntime/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/vcruntime140.dll
  - from: C:/Windows/System32/vcruntime140_1.dll
    to: onnxruntime/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/vcruntime140_1.dll
  - from: resources/models
    to: models
  - from: resources/fonts
    to: fonts
  - from: resources/licences
    to: licences
  - from: THIRD-PARTY-NOTICES.md
    to: licences/THIRD-PARTY-NOTICES.md

# Double-clicking a project file opens it in Editbay. The installer registers
# the extension; the app reads the path from its command line.
fileAssociations:
  - ext: editbay
    name: Editbay project
    description: Editbay project
    role: Editor

# The window is in English only, so Chromium's other languages, about 45 MB,
# stay out of the installer.
electronLanguages:
  - en-US

# Switches built into the Electron program itself. The installed Editbay.exe
# cannot be told by NODE_OPTIONS to load other code, cannot be run as plain
# Node or opened to a debugger, and it only runs the app it was built with,
# checked against a hash when it starts.
#
# The packaged test needs two of them on: it stands a Node script in for the
# speech engine, run by the app's own program as Node, and Playwright drives
# the app through the inspect flags. So it runs a copy of its own, built by
# `npm run dist:test` from electron-builder.test.yml, which differs from this
# only in those two switches and in where it is written (audit 2026-10-01).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Releases are named with two numbers, 1.0, 1.1, where people see them; package.json keeps
  # three (1.0.0) because the build tools need it. Change this with the version.
  artifactName: Editbay Setup 1.0.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Editbay
